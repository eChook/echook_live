document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #fafafa; color: #18181b; -webkit-font-smoothing: antialiased; font-family: ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Helvetica, Arial, sans-serif; }\n  a { color: #cb1557; text-decoration: none; }\n  a:hover { text-decoration: underline; }\n  @keyframes echookPulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }\n  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;background:#fafafa;color:#18181b;padding-bottom:96px\">\n\n  <header style=\"height:64px;background:#ffffff;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50\">\n    <div style=\"display:flex;align-items:flex-end;gap:0;font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap\">\n      <span style=\"font-family:Oswald, sans-serif;font-size:24px;line-height:1;font-weight:700\">eChook<\u002Fspan><span style=\"color:#cb1557;line-height:1\">Live<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px\">\n      <span style=\"font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#71717a\">UI &amp; UX Design System<\u002Fspan>\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;padding:4px 10px;border-radius:9999px;background:#e4e4e7;border:1px solid #d4d4d8;color:#52525b\">v1.0<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width:1120px;margin:0 auto;padding:48px 24px 0;display:flex;flex-direction:column;gap:64px\">\n\n    <section>\n      <h1 style=\"font-size:36px;line-height:1.1;font-weight:700;margin:0 0 16px;max-width:20ch;text-wrap:pretty\">Race-ready telemetry UI, one family across eChook products.<\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.6;color:#52525b;max-width:70ch;margin:0 0 24px;text-wrap:pretty\">Zinc/neutral light–dark surfaces, a single magenta accent, Oswald for the wordmark only, monospace for live values, Heroicons outline, bordered panels instead of heavy shadows. Technical, calm under pressure, readable on a pit-lane laptop in bright sun or dark garage light.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px\">\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:16px\">\n          <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margin-bottom:6px\">Tone<\u002Fdiv>\n          <div style=\"font-size:14px;color:#18181b\">Direct, technical, trustworthy<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:16px\">\n          <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margin-bottom:6px\">Density<\u002Fdiv>\n          <div style=\"font-size:14px;color:#18181b\">Information-dense, never cramped<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:16px\">\n          <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margin-bottom:6px\">Motif<\u002Fdiv>\n          <div style=\"font-size:14px;color:#18181b\">Magenta signal on quiet chrome<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:16px\">\n          <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margin-bottom:6px\">Avoid<\u002Fdiv>\n          <div style=\"font-size:14px;color:#18181b\">Gradients, glow, emoji, glass kitsch<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section>\n      <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #e4e4e7;padding-bottom:12px;margin-bottom:24px\">\n        <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#cb1557\">01<\u002Fspan>\n        <h2 style=\"font-size:18px;font-weight:600;margin:0\">Brand mark<\u002Fh2>\n        <span style=\"font-size:12px;color:#71717a;margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">components/AppBrand.vue<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:32px;display:flex;align-items:center;justify-content:center\">\n          <div style=\"display:flex;align-items:flex-end;font-weight:700;font-size:20px;letter-spacing:-.01em;color:#18181b\">\n            <span style=\"font-family:Oswald, sans-serif;font-size:24px;line-height:1;letter-spacing:normal\">eChook<\u002Fspan><span style=\"color:#cb1557;line-height:1\">Live<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #404040;background:#171717;border-radius:12px;padding:32px;display:flex;align-items:center;justify-content:center\">\n          <div style=\"display:flex;align-items:flex-end;font-weight:700;font-size:20px;letter-spacing:-.01em;color:#ffffff\">\n            <span style=\"font-family:Oswald, sans-serif;font-size:24px;line-height:1;letter-spacing:normal\">eChook<\u002Fspan><span style=\"color:#cb1557;line-height:1\">Live<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:8px;font-size:13px;color:#52525b;line-height:1.5\"><span style=\"color:#cb1557;font-we le=\"font-size:24px;font-weight:700;flex:1;min-width:240px\">Page title — 24px bold<\u002Fspan>\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#71717a\">text-2xl font-bold<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:20px 24px;border-bottom:1px solid #f4f4f5\">\n          <span style=\"font-size:30px;font-weight:700;color:#cb1557;flex:1;min-width:240px\">Auth panel title<\u002Fspan>\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#71717a\">text-3xl font-bold text-primary<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:20px 24px;border-bottom:1px solid #f4f4f5\">\n          <span style=\"font-size:18px;font-weight:600;flex:1;min-width:240px\">Section title<\u002Fspan>\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#71717a\">text-lg font-semibold + rule<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:20px 24px;border-bottom:1px solid #f4f4f5\">\n          <span style=\"font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#71717a;flex:1;min-width:240px\">Section eyebrow<\u002Fspan>\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#71717a\">text-sm uppercase tracking-wide<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:20px 24px;border-bottom:1px solid #f4f4f5\">\n          <span style=\"font-size:14px;color:#52525b;flex:1;min-width:240px\">Body copy sits at 14px, muted zinc, comfortable line height.<\u002Fspan>\n          <span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#71717a\">text-sm text-zinc-600<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:base 717a;margin-bottom:16px\">Spacing rhythm<\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:12px\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:8px;height:8px;background:#cb1557;border-radius:2px\"><\u002Fdiv><span style=\"font-family:ui-monospace,monospace;font-size:10px;color:#71717a\">2<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:12px;height:12px;background:#cb1557;border-radius:2px\"><\u002Fdiv><span style=\"font-family:ui-monospace,monospace;font-size:10px;color:#71717a\">3<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:16px;height:16px;background:#cb1557;border-radius:2px\"><\u002Fdiv><span style=\"font-family:ui-monospace,monospace;font-size:10px;color:#71717a\">4<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:24px;height:24px;background:#cb1557;border-radius:2px\"><\u002Fdiv><span style=\"font-family:ui-monospace,monospace;font-size:10px;color:#71717a\">6<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><div style=\"width:32px;height:32px;background:#cb1557;border-radius:2px\"><\u002Fdiv><span style=\"font-family:ui-monospace,monospace;font-size:10px;color:#71717a\">8<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:#52525b;margin:16px 0 0;line-height:1.6\">Card padding 16px compact / 24–32px public. Major blocks stack at 24px. Form fields at 20px with labels 4–8px above.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:20px\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margi 9.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;color:#71717a;font-family:ui-monospace,monospace\">Map<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 3v1.5M3 21v-6m0 0 2.77-.693a9 9 0 0 1 6.208.682l.108.054a9 9 0 0 0 6.086.71l3.114-.732a48.524 48.524 0 0 1-.005-10.499l-3.11.732a9 9 0 0 1-6.085-.711l-.108-.054a9 9 0 0 0-6.208-.682L3 4.5M3 15V4.5\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;color:#71717a;font-family:ui-monospace,monospace\">Flag<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;color:#71717a;font-family:ui-monospace,monospace\">Download<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;color:#52525b;margin:16px 0 0;line-height:1.6;max-width:72ch\">16px inline, 20px controls, 24px nav. Colour inherits from text; only stats and accents take a semantic colour. Custom icons must match the outline weight and 24px optical size.<\u002Fp>\n    <\u002Fsection>\n\n    <section>\n      <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #e4e4e7;padding-bottom:12px;margin-bottom:24px\">\n        <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#cb1557\">11<\u002Fspan>\n        <h2 style=\"font-size:18px;font-weight:600;margin:0\">Motion, accessibility, dark mode<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:20px\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margin-bottom:12px\">Motion<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;color:#52525b;line-height:1.5\">\n            <div>Button press — <span style=\"font-family:ui-monospace,monospace;font-size:12px\">active:scale-95<\u002Fspan><\u002Fdiv>\n            <div>Data card hover — 200ms, −2px lift<\u002Fdiv>\n            <div>Modal / toast — 150–300ms ease<\u002Fdiv>\n            <div>Ribbon show/hide — ~300ms height + opacity<\u002Fdiv>\n            <div>Live pulse — dots and LIVE chips only<\u002Fdiv>\n            <div>Spinner — <span style=\"font-family:ui-monospace,monospace;font-size:12px\">animate-spin<\u002Fspan> on ArrowPath, loading only<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;padding-top:16px;border-top:1px solid #e4e4e7;font-size:13px;color:#52525b;line-height:1.6\">No continuous background animation, particles, or glowing borders. Every animation pairs with a reduced-motion fallback.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:20px\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margin-bottom:12px\">Accessibility floor<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;color:#52525b;line-height:1.5\">\n            <div>Icon-only controls carry accessible names.<\u002Fdiv>\n            <div>Active nav sets <span style=\"font-family:ui-monospace,monospace;font-size:12px\">aria-current=\"page\"<\u002Fspan>.<\u002Fdiv>\n            <div>Modals trap focus, close on Escape and backdrop.<\u002Fdiv>\n            <div>Toasts use <span style=\"font-family:ui-monospace,monospace;font-size:12px\">role=\"alert\"<\u002Fspan> with manual dismiss.<\u002Fdiv>\n            <div>Status pairs a dot with a label — never colour alone.<\u002Fdiv>\n            <div>Touch targets ≥ 44px on pit-side phones.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:20px\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margin-bottom:12px\">Dark mode<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;color:#52525b;line-height:1.5\">\n            <div>Class strategy: <span style=\"font-family:ui-monospace,monospace;font-size:12px\">.dark<\u002Fspan> on <span style=\"font-family:ui-monospace,monospace;font-size:12px\">&lt;html&gt;<\u002Fspan>, mode light / dark / system.<\u002Fdiv>\n            <div>Theme applied before first paint by an inline boot script.<\u002Fdiv>\n            <div><span style=\"font-family:ui-monospace,monospace;font-size:12px\">color-scheme<\u002Fspan> set so native controls follow.<\u002Fdiv>\n            <div>Light uses zinc, dark uses neutral; muted text in dark leans gray.<\u002Fdiv>\n            <div><strong>Link and inline-action text on dark surfaces uses <span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#cb1557\">#f472a0<\u002Fspan><\u002Fstrong>, not raw primary — <span style=\"font-family:ui-monospace,monospace;font-size:12px\">#cb1557<\u002Fspan> on <span style=\"font-family:ui-monospace,monospace;font-size:12px\">#262626<\u002Fspan> is only 2.7:1. Solid magenta buttons and light-theme links are unchanged.<\u002Fdiv>\n            <div>Every new surface ships both themes in the same class string.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showCode }}\" hint-placeholder-val=\"{{ true }}\">\n    <section>\n      <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #e4e4e7;padding-bottom:12px;margin-bottom:24px\">\n        <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#cb1557\">12<\u002Fspan>\n        <h2 style=\"font-size:18px;font-weight:600;margin:0\">Class recipes<\u002Fh2>\n        <span style=\"font-size:12px;color:#71717a;margin-left:auto\">paste into a new eChook project<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px\">\n        <div style=\"background:#171717;border:1px solid #404040;border-radius:12px;padding:20px;overflow-x:auto\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#a3a3a3;margin-bottom:12px\">tailwind.config.js<\u002Fdiv>\n          <pre style=\"margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;color:#e4e4e7\">darkMode: 'class',\ntheme: { extend: {\n  colors: { primary: '#cb1557' },\n  fontFamily: { oswald: ['Oswald','sans-serif'] },\n}}<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"background:#171717;border:1px solid #404040;border-radius:12px;padding:20px;overflow-x:auto\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#a3a3a3;margin-bottom:12px\">Semantic variables<\u002Fdiv>\n          <pre style=\"margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;color:#e4e4e7\">:root { --app-bg:#fafafa; --app-surface:#fff;\n  --app-text:#18181b; --app-muted:#71717a;\n  --app-border:#e4e4e7; --app-primary:#cb1557; }\n.dark { --app-bg:#171717; --app-surface:#262626;\n  --app-text:#fafafa; --app-muted:#a3a3a3;\n  --app-border:#404040; --app-primary:#cb1557; }<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"background:#171717;border:1px solid #404040;border-radius:12px;padding:20px;overflow-x:auto\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#a3a3a3;margin-bottom:12px\">Component cheatsheet<\u002Fdiv>\n          <pre style=\"margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;color:#e4e4e7\">Primary   bg-primary hover:bg-primary/90 text-white\n          font-semibold rounded-lg px-4 py-2 transition\nSecondary bg-zinc-200 dark:bg-neutral-800 border\n          border-zinc-300 dark:border-neutral-700\nPanel     rounded-xl border border-zinc-200\n          dark:border-neutral-700 bg-white\n          dark:bg-neutral-900 p-6\nInput     focus:border-primary focus:ring-1\n          focus:ring-primary outline-none\nNav       active: bg-primary/10 text-primary\nMetric    font-mono font-bold<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"background:#171717;border:1px solid #404040;border-radius:12px;padding:20px;overflow-x:auto\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#a3a3a3;margin-bottom:12px\">Z-index ladder<\u002Fdiv>\n          <pre style=\"margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;color:#e4e4e7\">z-40      content, side nav\nz-50      sticky header, mobile nav, cookie bar\nz-50/60   dropdown overlays\nz-[100]   feature modals\nz-[110]   confirmation modals\nz-[9999]  toasts<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section>\n      <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #e4e4e7;padding-bottom:12px;margin-bottom:24px\">\n        <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#cb1557\">13<\u002Fspan>\n        <h2 style=\"font-size:18px;font-weight:600;margin:0\">Do / Don't<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:24px\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#cb1557;margin-bottom:16px\">Do<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;color:#3f3f46;line-height:1.5\">\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#cb1557;font-weight:700\">+<\u002Fspan><span>Use magenta sparingly, as signal.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#cb1557;font-weight:700\">+<\u002Fspan><span>Pair every dark style with its light counterpart.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#cb1557;font-weight:700\">+<\u002Fspan><span>Live values in mono; the wordmark in Oswald.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#cb1557;font-weight:700\">+<\u002Fspan><span>Prefer borders and quiet fills over shadow stacks.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#cb1557;font-weight:700\">+<\u002Fspan><span>Confirm destructive or data-lossy actions.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#cb1557;font-weight:700\">+<\u002Fspan><span>State retention and privacy next to the action.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #e4e4e7;background:#ffffff;border-radius:12px;padding:24px\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#71717a;margin-bottom:16px\">Don't<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;color:#3f3f46;line-height:1.5\">\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#a1a1aa;font-weight:700\">−<\u002Fspan><span>Recolour the UI around pink backgrounds.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#a1a1aa;font-weight:700\">−<\u002Fspan><span>Add a second brand accent without a semantic reason.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#a1a1aa;font-weight:700\">−<\u002Fspan><span>Set Oswald in body copy or form labels.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#a1a1aa;font-weight:700\">−<\u002Fspan><span>Animate everything that is merely visible.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#a1a1aa;font-weight:700\">−<\u002Fspan><span>Ship light-only screens.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px\"><span style=\"color:#a1a1aa;font-weight:700\">−<\u002Fspan><span>Wrap every piece of text in a card.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"border-top:1px solid #e4e4e7;padding-top:24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center\">\n      <span style=\"font-size:12px;color:#71717a\">eChook ecosystem design system · derived from the eChook Live source<\u002Fspan>\n      <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#a1a1aa\">AGPL-3.0 · Vue 3 · Tailwind · Heroicons v2<\u002Fspan>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showInSitu&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showCode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showInSitu: this.props.showInSitu ?? true,\n      showCode: this.props.showCode ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
